  <style>
    #app-preloader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100%;
      background: #f7f9fc;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 9999;
      transition: opacity 0.25s ease-out;
    }
    #app-preloader.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    #app-preloader svg {
      width: 48px;
      height: 48px;
    }
    #app-preloader svg circle {
      fill: #3880ff;
      animation: spinner-fade-out 1s linear infinite;
    }
    @keyframes spinner-fade-out {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }
    #app-preloader .preloader-text {
      margin-top: 16px;
      font-size: 16px;
      color: #425466;
      font-weight: 500;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>

  <!-- Global preloader: lives OUTSIDE app-root so Angular bootstrap doesn't remove it.
       Removed programmatically by the app when data is ready. -->
  <div id="app-preloader">
    <!-- Exact replica of ion-spinner[name="circles"] from Ionic source:
         viewBox 0 0 64 64, 8 circles r=5, transform translate(32,32),
         positioned at top: 32*sin(2πi/8)%, left: 32*cos(2πi/8)%,
         animation-delay: 1000*(i/8) - 1000 ms -->
    <svg viewBox="0 0 64 64">
      <circle r="5" cx="52.5" cy="32" style="animation-delay: -1000ms"/>
      <circle r="5" cx="46.5" cy="46.5" style="animation-delay: -875ms"/>
      <circle r="5" cx="32" cy="52.5" style="animation-delay: -750ms"/>
      <circle r="5" cx="17.5" cy="46.5" style="animation-delay: -625ms"/>
      <circle r="5" cx="11.5" cy="32" style="animation-delay: -500ms"/>
      <circle r="5" cx="17.5" cy="17.5" style="animation-delay: -375ms"/>
      <circle r="5" cx="32" cy="11.5" style="animation-delay: -250ms"/>
      <circle r="5" cx="46.5" cy="17.5" style="animation-delay: -125ms"/>
    </svg>
    <p class="preloader-text">Loading payment options...</p>
  </div>
