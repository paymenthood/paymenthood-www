name: SnapScan
slug: snapscan
status: live
category: regional
region: South Africa
logo: /assets/images/home/providers-icon/SnapScan-light.png
accent: "#00b4a0"
accent_rgb: "0,180,160"
accent_text: "#007f70"   # WCAG AA on white and .bg-light; see _sass/components/_provider.scss

summary: >-
  SnapScan is a South African QR-code payment app. At checkout the customer scans a QR code with
  the SnapScan app and approves the payment with a PIN or biometric — no card details are entered
  on the merchant's site. Launched in 2013, it was one of the first mobile payment apps in South
  Africa and is accepted by tens of thousands of merchants.

countries:
  - South Africa

currencies: [ZAR]

methods:
  - label: QR code
    icon: qr
    detail: Customer scans at checkout and approves in the SnapScan app
  - label: Payment links
    icon: link
    detail: A shareable link for invoices, email and social selling

platforms: [woocommerce, whmcs, virtuemart, phoca-cart, j2commerce]

links:
  website: https://www.snapscan.co.za/
  docs: https://developer.snapscan.co.za/
  pricing: https://www.snapscan.co.za/

integration:
  auth: Merchant API key, held server-side in PaymentHood
  webhook: Signed payment notification, validated before the order is released
  verification: Server-side payment status re-check against the SnapScan merchant API before fulfilment

faqs:
  - q: How does a SnapScan payment work at online checkout?
    a: >-
      The customer selects SnapScan, a QR code containing your merchant SnapCode plus the order
      amount and reference is displayed, and they scan it with the SnapScan app. They approve with
      a PIN or biometric, and the merchant is notified in real time. Because the amount and order
      reference are embedded in the code, the customer does not retype anything.
  - q: Does the customer need the SnapScan app?
    a: >-
      Yes — SnapScan is an app-based wallet, so it only reaches customers who have installed it.
      That is exactly why it belongs alongside cards and pay-by-bank rather than replacing them.
      PaymentHood lets you offer all three from one integration.
  - q: Is SnapScan suitable for a desktop checkout?
    a: >-
      It works, since the customer scans the on-screen code with their phone. It is strongest on
      mobile-heavy traffic and for invoice or link-based selling, where the payment link can be sent
      directly to the customer.
  - q: Can I use SnapScan and Zapper together?
    a: >-
      Yes. They are competing QR wallets with different user bases, and offering both costs you
      nothing extra behind PaymentHood — both are configured in the dashboard against the same
      checkout integration.
  - q: Does PaymentHood charge on top of SnapScan's fees?
    a: >-
      No. PaymentHood adds nothing to what SnapScan charges: no percentage, no per-transaction
      cut, and no volume threshold where that changes. SnapScan bills you directly for its own
      processing fees, and you keep that relationship. PaymentHood's only paid plan is Premium
      at $29 a month, which adds white-label checkout branding and nothing to your transaction
      cost. See <a href="/pricing.html" class="txt-blue-100">PaymentHood pricing</a>.

