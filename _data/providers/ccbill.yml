# RE-SAMPLE THIS. #0073ac was taken from the OLD artwork's blue background block,
# which no longer exists — the replacement is a blue wordmark on white, and its
# blue reads brighter than this value. The contrast figures below are correct for
# #0073ac itself, so if the mark's true blue is used instead, recompute them
# against #ffffff and #f8f9fa before changing `accent_text`.
# Contrast computed, per _sass/components/_provider.scss:
#   #0073ac — 5.19:1 on #ffffff, 4.92:1 on #f8f9fa  (fills, gradients)
#   #006292 — 6.64:1 on #ffffff, 6.30:1 on #f8f9fa  (text and small icons)
