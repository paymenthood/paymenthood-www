# What PaymentHood does on the merchant's behalf — keep accurate to the actual
# implementation, not to the provider's own marketing.
integration:
  auth: Merchant credentials issued per market, held server-side in PaymentHood
  webhook: Signed billing notification, validated before an order is released
  verification: Server-side transaction status re-check before fulfilment

faqs:
  - q: What is direct carrier billing?
    a: >-
      The purchase is charged to the customer's mobile phone bill or prepaid balance instead of
      a card. No bank account, no card and no app are needed — which is why it reaches audiences
      no card gateway can.
  - q: What is it actually good for?
    a: >-
      Low-value digital purchases: games, subscriptions, video, education. Carrier billing fees
      are far higher than card fees and per-transaction limits are low, so it does not suit
      physical goods or large baskets.
  - q: How many markets does Tpay cover?
    a: >-
      Markets across the Middle East, Africa and Türkiye, connected to a large number of mobile
      payment channels. Coverage is defined per operator, so confirm your specific market and
      network.
  - q: Does PaymentHood charge extra on top of Tpay?
    a: >-
      No. PaymentHood adds nothing to what Tpay charges: no percentage, no per-transaction cut,
      and no volume threshold where that changes. Tpay bills you directly for its own processing
      fees, and you keep that relationship. PaymentHood's only paid plan is Premium at $29 a
      month, which adds white-label checkout branding and nothing to your transaction cost. See
      <a href="/pricing.html">PaymentHood pricing</a>.

