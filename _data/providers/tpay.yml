# Lead paragraph, written to be lifted verbatim as a featured snippet or an
# LLM citation: definition first, no marketing wind-up.
summary: >-
  Tpay (TPAY MOBILE) is a mobile-payments acquirer for the Middle East, Africa and Türkiye,
  reaching consumers through direct carrier billing, mobile wallets and mobile money across
  the region. It bills the purchase to the customer's phone account, so it reaches people with
  no card and no bank account at all.

