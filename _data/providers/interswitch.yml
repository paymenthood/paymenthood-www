# Single source of truth for /providers/interswitch/.
#
# RULE: every factual claim rendered on the provider page comes from this file,
# and every field traces to a URL in `verification.sources`. Nothing is written
# from memory. `fees` is deliberately absent from the schema — provider pricing
# changes without notice, so the template links to the provider's own pricing
# page rather than restating a number that will go stale.
#
# accent_text is computed, not chosen: it is `accent` darkened until it clears
# WCAG AA (4.5:1) on white and on .bg-light. Use it for text and small icons;
# `accent` stays the true brand colour for fills and gradients.
#
# Set `verification.verified_by` once every field is checked against the sources
# below, then delete `noindex`/`sitemap: false` from providers/interswitch/index.html.

name: Interswitch
slug: interswitch
status: live
category: regional
region: Nigeria / Africa
logo: /assets/images/home/providers-icon/interswitch-light.png
accent: "#c8102e"
accent_rgb: "200,16,46"
accent_text: "#c8102e"   # computed: 5.88 on white, 5.58 on bg-light

# Lead paragraph, written to be lifted verbatim as a featured snippet or an
# LLM citation: definition first, no marketing wind-up.
summary: >-
  Interswitch is the payments infrastructure company much of Nigeria's card and switching
  network runs on, and its Interswitch Payment Gateway offers merchants cards, USSD, bank
  transfer and QR through one integration. Being the incumbent switch rather than a challenger
  is its distinguishing characteristic — depth of bank connectivity over product polish.

countries:
  - Nigeria
  - Ghana
  - Kenya
  - Uganda
  - Gambia

currencies: [NGN, USD]

methods:
  - label: Cards
    icon: card
    detail: Verve, Visa and Mastercard, local and international
  - label: USSD
    icon: ussd
    detail: Bank shortcodes for customers without a smartphone
  - label: Bank transfer
    icon: bank
    detail: Direct transfer confirmed against the order
  - label: QR
    icon: qr
    detail: Scan-to-pay at checkout

platforms: [woocommerce, whmcs, virtuemart, phoca-cart, j2commerce]

links:
  website: https://interswitchgroup.com/
  docs: https://docs.interswitchgroup.com/docs/payment-api
  pricing: https://interswitchgroup.com/ipg

# What PaymentHood does on the merchant's behalf — keep accurate to the actual
# implementation, not to the provider's own marketing.
integration:
  auth: Client ID and secret exchanged for an access token, held server-side in PaymentHood
  webhook: Signed transaction notification, validated before an order is released
  verification: Server-side transaction query against the Interswitch API before fulfilment

faqs:
  - q: What currency does Interswitch settle in?
    a: >-
      Naira is the primary settlement currency, with multi-currency acceptance and USD settlement
      available for eligible flows. Confirm your own account's currency support with Interswitch
      rather than assuming it.
  - q: What is Verve and do I need to accept it?
    a: >-
      Verve is Nigeria's domestic card scheme and a large share of Nigerian debit cards carry it.
      A checkout that only takes Visa and Mastercard will decline a meaningful number of
      otherwise-good Nigerian cards.
  - q: Why does bank transfer matter so much in Nigeria?
    a: >-
      Card penetration is lower than transfer usage, and card declines are common. A checkout
      offering a one-time virtual account number — the customer transfers from any bank app and
      the payment confirms in seconds — will convert materially better than one offering cards
      alone. It is the single most important local method to enable.
  - q: Does PaymentHood charge extra on top of Interswitch?
    a: >-
      No. Interswitch bills you directly for its own fees, and PaymentHood takes no percentage and
      no per-transaction cut at any volume. See <a href="/pricing.html">PaymentHood pricing</a>.

