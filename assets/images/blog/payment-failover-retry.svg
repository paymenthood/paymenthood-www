<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="A payment times out at the first provider and is retried through a second, which captures it. A hard decline from the issuer is shown separately as something no reroute can fix.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2fb"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="card" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1f6feb" flood-opacity="0.14"/>
    </filter>
    <marker id="aRed" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#e0475a"/>
    </marker>
    <marker id="aGreen" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#16b364"/>
    </marker>
    <marker id="aBlue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#1f6feb"/>
    </marker>
  </defs>

  <style>
    .t    { font-family: system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    .hd   { font-size: 24px; font-weight: 700; fill: #12183a; }
    .lb   { font-size: 20px; font-weight: 600; fill: #12183a; }
    .mu   { font-size: 17px; font-weight: 500; fill: #64748b; }
    .cap  { font-size: 16px; font-weight: 700; letter-spacing: .07em; }
    .bad  { font-size: 18px; font-weight: 600; fill: #e0475a; }
    .good { font-size: 18px; font-weight: 600; fill: #16b364; }
  </style>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1110" cy="90" r="180" fill="#1f6feb" opacity="0.05"/>

  <text class="t cap" x="60" y="62" fill="#1f6feb">WORTH RETRYING ELSEWHERE</text>
  <line x1="60" y1="78" x2="1140" y2="78" stroke="#dbe4f6" stroke-width="2"/>

  <!-- payment -->
  <g filter="url(#card)">
    <rect x="60" y="176" width="196" height="96" rx="15" fill="#ffffff" stroke="#dbe4f6" stroke-width="2"/>
  </g>
  <rect x="60" y="176" width="196" height="6" rx="3" fill="#1f6feb"/>
  <text class="t hd" x="158" y="222" text-anchor="middle">Payment</text>
  <text class="t mu" x="158" y="250" text-anchor="middle">key ord_1029</text>

  <!-- attempt 1 -->
  <line x1="258" y1="224" x2="356" y2="224" stroke="#1f6feb" stroke-width="4" marker-end="url(#aBlue)"/>
  <text class="t mu" x="307" y="206" text-anchor="middle">1st</text>
  <g filter="url(#card)">
    <rect x="368" y="172" width="248" height="104" rx="15" fill="#ffffff" stroke="#e0475a" stroke-width="2.5"/>
  </g>
  <text class="t hd" x="396" y="214">Provider A</text>
  <text class="t bad" x="396" y="245">timeout / 5xx</text>
  <g stroke="#e0475a" stroke-width="7" stroke-linecap="round">
    <line x1="566" y1="198" x2="594" y2="226"/>
    <line x1="594" y1="198" x2="566" y2="226"/>
  </g>

  <!-- retry down and across -->
  <path d="M492 288 L 492 356 L 700 356" fill="none" stroke="#1f6feb" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#aBlue)"/>
  <rect x="500" y="308" width="188" height="38" rx="9" fill="#eef4ff"/>
  <text class="t mu" x="594" y="333" text-anchor="middle">retried, same key</text>

  <!-- attempt 2 -->
  <g filter="url(#card)">
    <rect x="712" y="304" width="248" height="104" rx="15" fill="#e9faf1" stroke="#16b364" stroke-width="3"/>
  </g>
  <text class="t hd" x="740" y="346">Provider B</text>
  <text class="t good" x="740" y="377">captured</text>
  <path d="M906 348 l14 16 l26 -34" stroke="#16b364" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <line x1="962" y1="356" x2="1062" y2="356" stroke="#16b364" stroke-width="4" marker-end="url(#aGreen)"/>
  <text class="t good" x="1090" y="350" text-anchor="middle">paid</text>
  <text class="t mu" x="1090" y="376" text-anchor="middle">once</text>

  <!-- the exception -->
  <text class="t cap" x="60" y="494" fill="#e0475a">NOT WORTH RETRYING</text>
  <line x1="60" y1="510" x2="1140" y2="510" stroke="#f6d5da" stroke-width="2"/>
  <g filter="url(#card)">
    <rect x="60" y="536" width="1080" height="96" rx="15" fill="#fdeef0" stroke="#f3c2ca" stroke-width="2"/>
  </g>
  <circle cx="116" cy="584" r="22" fill="#e0475a"/>
  <line x1="116" y1="572" x2="116" y2="588" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <circle cx="116" cy="597" r="3" fill="#fff"/>
  <text class="t lb" x="158" y="578">Hard decline: insufficient funds, stolen card, a genuine no from the issuer.</text>
  <text class="t mu" x="158" y="608">Rerouting it changes nothing. It annoys the bank and can look like card testing.</text>
</svg>
