<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="One payment carrying a currency, country and method is matched against routing rules, which send it to the provider that fits and skip the two that do not.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2fb"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="card" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1f6feb" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#1f6feb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#16b364"/>
    </marker>
  </defs>

  <style>
    .t   { font-family: system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    .hd  { font-size: 25px; font-weight: 700; fill: #12183a; }
    .lb  { font-size: 20px; font-weight: 600; fill: #12183a; }
    .mu  { font-size: 17px; font-weight: 500; fill: #64748b; }
    .cap { font-size: 16px; font-weight: 600; letter-spacing: .06em; }
    .ok  { font-size: 19px; font-weight: 700; fill: #16b364; }
    .no  { font-size: 18px; font-weight: 600; fill: #94a3b8; }
  </style>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1100" cy="80" r="190" fill="#1f6feb" opacity="0.06"/>

  <!-- the payment -->
  <g filter="url(#card)">
    <rect x="60" y="258" width="238" height="160" rx="16" fill="#ffffff" stroke="#dbe4f6" stroke-width="2"/>
  </g>
  <rect x="60" y="258" width="238" height="6" rx="3" fill="#1f6feb"/>
  <text class="t hd" x="179" y="306" text-anchor="middle">One payment</text>
  <g>
    <rect x="86" y="326" width="76" height="34" rx="8" fill="#eef4ff"/>
    <text class="t mu" x="124" y="349" text-anchor="middle">EUR</text>
    <rect x="170" y="326" width="58" height="34" rx="8" fill="#eef4ff"/>
    <text class="t mu" x="199" y="349" text-anchor="middle">NL</text>
    <rect x="86" y="370" width="142" height="34" rx="8" fill="#eef4ff"/>
    <text class="t mu" x="157" y="393" text-anchor="middle">bank transfer</text>
  </g>

  <line x1="300" y1="338" x2="392" y2="338" stroke="#1f6feb" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- the rules -->
  <g filter="url(#card)">
    <rect x="404" y="214" width="296" height="248" rx="18" fill="#ffffff" stroke="#1f6feb" stroke-width="2.5"/>
  </g>
  <text class="t cap" x="552" y="254" text-anchor="middle" fill="#1f6feb">ROUTING RULES</text>
  <g>
    <rect x="432" y="278" width="240" height="40" rx="9" fill="#f6fafd" stroke="#e3ebf9"/>
    <text class="t lb" x="452" y="305">currency</text>
    <rect x="432" y="326" width="240" height="40" rx="9" fill="#f6fafd" stroke="#e3ebf9"/>
    <text class="t lb" x="452" y="353">country</text>
    <rect x="432" y="374" width="240" height="40" rx="9" fill="#f6fafd" stroke="#e3ebf9"/>
    <text class="t lb" x="452" y="401">method</text>
  </g>
  <text class="t mu" x="552" y="442" text-anchor="middle">evaluated per transaction</text>

  <!-- decisions out -->
  <path d="M702 338 C 770 338 780 160 862 160" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="7 7"/>
  <path d="M702 338 L 862 338" fill="none" stroke="#16b364" stroke-width="4.5" marker-end="url(#arrowGreen)"/>
  <path d="M702 338 C 770 338 780 516 862 516" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="7 7"/>

  <!-- providers -->
  <g>
    <rect x="874" y="126" width="266" height="70" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" opacity="0.75"/>
    <text class="t lb" x="900" y="158" fill="#64748b">Card provider</text>
    <text class="t no" x="900" y="182">no EUR bank transfer</text>

    <rect x="874" y="300" width="266" height="76" rx="13" fill="#e9faf1" stroke="#16b364" stroke-width="3"/>
    <text class="t hd" x="900" y="333">Local rail</text>
    <text class="t ok" x="900" y="360">matches all three</text>

    <rect x="874" y="482" width="266" height="70" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" opacity="0.75"/>
    <text class="t lb" x="900" y="514" fill="#64748b">Wallet provider</text>
    <text class="t no" x="900" y="538">not available in NL</text>
  </g>

  <text class="t mu" x="600" y="626" text-anchor="middle">the rule changes in configuration, not in checkout code</text>
</svg>
