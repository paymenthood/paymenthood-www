<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="A timeline of one payment: the charge is created, the confirmation times out, the caller retries with the same idempotency key, and the provider returns the original result instead of creating a second charge.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2fb"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="card" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1f6feb" flood-opacity="0.14"/>
    </filter>
  </defs>

  <style>
    .t    { font-family: system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    .hd   { font-size: 21px; font-weight: 700; fill: #12183a; }
    .mu   { font-size: 16px; font-weight: 500; fill: #64748b; }
    .cap  { font-size: 16px; font-weight: 700; letter-spacing: .07em; }
    .key  { font-size: 17px; font-weight: 700; fill: #1f6feb; }
    .good { font-size: 19px; font-weight: 700; fill: #16b364; }
    .warn { font-size: 17px; font-weight: 600; fill: #f0a500; }
    .mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace; }
  </style>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1110" cy="80" r="170" fill="#1f6feb" opacity="0.05"/>

  <text class="t cap" x="60" y="62" fill="#1f6feb">ONE INTENDED PAYMENT, FOUR EVENTS, ONE CHARGE</text>

  <!-- lanes -->
  <text class="t mu" x="60" y="166">Your system</text>
  <text class="t mu" x="60" y="418">Provider</text>
  <line x1="60" y1="182" x2="1140" y2="182" stroke="#e3ebf9" stroke-width="2"/>
  <line x1="60" y1="434" x2="1140" y2="434" stroke="#e3ebf9" stroke-width="2"/>

  <!-- time axis -->
  <line x1="180" y1="300" x2="1120" y2="300" stroke="#cbd5e1" stroke-width="3"/>
  <text class="t mu" x="1128" y="306">time</text>
  <g fill="#1f6feb">
    <circle cx="250" cy="300" r="9"/>
    <circle cx="520" cy="300" r="9"/>
    <circle cx="790" cy="300" r="9"/>
    <circle cx="1040" cy="300" r="9"/>
  </g>

  <!-- 1. create -->
  <g filter="url(#card)">
    <rect x="130" y="196" width="240" height="78" rx="13" fill="#ffffff" stroke="#dbe4f6" stroke-width="2"/>
  </g>
  <text class="t hd" x="152" y="228">1. Create charge</text>
  <text class="t key mono" x="152" y="256">key ord_1029</text>
  <line x1="250" y1="276" x2="250" y2="292" stroke="#1f6feb" stroke-width="3"/>
  <path d="M250 308 L 250 392" stroke="#1f6feb" stroke-width="3.5"/>

  <!-- provider captures -->
  <g filter="url(#card)">
    <rect x="130" y="396" width="330" height="82" rx="13" fill="#e9faf1" stroke="#16b364" stroke-width="2.5"/>
  </g>
  <text class="t hd" x="152" y="428">Charge created and captured</text>
  <text class="t mu" x="152" y="456">the money has moved, once</text>

  <!-- 2. timeout -->
  <path d="M460 437 C 520 437 520 400 520 316" stroke="#f0a500" stroke-width="3.5" stroke-dasharray="9 8" fill="none"/>
  <g filter="url(#card)">
    <rect x="400" y="196" width="240" height="78" rx="13" fill="#fff6e6" stroke="#f0a500" stroke-width="2.5"/>
  </g>
  <text class="t hd" x="422" y="228">2. Timeout</text>
  <text class="t warn" x="422" y="256">no answer reaches you</text>
  <line x1="520" y1="276" x2="520" y2="292" stroke="#f0a500" stroke-width="3"/>

  <!-- 3. retry -->
  <g filter="url(#card)">
    <rect x="670" y="196" width="240" height="78" rx="13" fill="#ffffff" stroke="#1f6feb" stroke-width="2.5"/>
  </g>
  <text class="t hd" x="692" y="228">3. Retry</text>
  <text class="t key mono" x="692" y="256">same key ord_1029</text>
  <line x1="790" y1="276" x2="790" y2="292" stroke="#1f6feb" stroke-width="3"/>
  <path d="M790 308 L 790 392" stroke="#1f6feb" stroke-width="3.5"/>

  <!-- provider recognises -->
  <g filter="url(#card)">
    <rect x="670" y="396" width="400" height="82" rx="13" fill="#ffffff" stroke="#dbe4f6" stroke-width="2"/>
  </g>
  <text class="t hd" x="692" y="428">Key already seen. No new charge.</text>
  <text class="t mu" x="692" y="456">the stored result is returned instead</text>

  <!-- 4. resolved -->
  <path d="M1070 437 C 1040 437 1040 400 1040 316" stroke="#16b364" stroke-width="3.5" fill="none"/>
  <g filter="url(#card)">
    <rect x="930" y="192" width="210" height="86" rx="13" fill="#e9faf1" stroke="#16b364" stroke-width="3"/>
  </g>
  <path d="M960 234 l16 18 l30 -36" stroke="#16b364" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="t good" x="1020" y="243">Resolved</text>
  <text class="t mu" x="1035" y="268" text-anchor="middle">one charge</text>

  <!-- the counterfactual -->
  <g filter="url(#card)">
    <rect x="60" y="548" width="1080" height="84" rx="15" fill="#fdeef0" stroke="#f3c2ca" stroke-width="2"/>
  </g>
  <g stroke="#e0475a" stroke-width="6" stroke-linecap="round">
    <line x1="104" y1="578" x2="128" y2="602"/>
    <line x1="128" y1="578" x2="104" y2="602"/>
  </g>
  <text class="t hd" x="158" y="584">Without the key, step 3 is a brand new charge.</text>
  <text class="t mu" x="158" y="612">Two real charges on a real card, from one intended payment, and it looks like fraud to the customer.</text>
</svg>
